# XcodeGen project definition — the source of truth for the Xcode project.
# Regenerate after adding files or changing settings:  xcodegen generate
# Ballast.xcodeproj is generated and git-ignored; never edit it by hand.

name: Ballast

options:
  bundleIdPrefix: com.kayode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2600"

settings:
  base:
    # Pinned to Swift 5 language mode, matching the rest of the portfolio.
    SWIFT_VERSION: "5.0"
    # Kayode's Apple Developer team, baked in so Run/Archive work without
    # touching Signing & Capabilities by hand.
    DEVELOPMENT_TEAM: SJW465977U
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Ballast:
    type: application
    platform: iOS
    sources:
      - path: Ballast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.ballast
        PRODUCT_NAME: Ballast
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ballast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  BallastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BallastTests
    dependencies:
      - target: Ballast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.ballast.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ballast:
    build:
      targets:
        Ballast: all
        BallastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BallastTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
